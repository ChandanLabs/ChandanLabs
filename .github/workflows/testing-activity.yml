name: Update testing activity

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: testing-activity
  cancel-in-progress: true

jobs:
  update-testing-activity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Detect testing-related public commits
        env:
          GITHUB_USERNAME: ${{ github.repository_owner }}
        run: node scripts/update-testing-activity.js

      - name: Commit README activity update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          if ! git diff --cached --quiet; then
            git commit -m "docs: refresh testing activity from public commits"
            git push
          else
            echo "No README activity changes to publish."
          fi
