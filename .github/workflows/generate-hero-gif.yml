name: Generate animated hero banner

on:
  push:
    branches: [main]
    paths:
      - "scripts/generate-hero-gif.py"
      - ".github/workflows/generate-hero-gif.yml"
  schedule:
    - cron: "29 2 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: generate-hero-banner
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install image dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-dejavu-core
          python -m pip install --upgrade pip
          python -m pip install Pillow

      - name: Generate animated GIF
        run: python scripts/generate-hero-gif.py

      - name: Commit generated banner
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add hero.gif
          if git diff --cached --quiet; then
            echo "Hero GIF is already up to date."
            exit 0
          fi
          git commit -m "chore: regenerate animated Java-first hero banner"

          # Other profile workflows may update main at the same time.
          # Rebase on the latest main and retry a non-force push.
          for attempt in 1 2 3 4; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push attempt ${attempt} failed; retrying after refreshing main."
            sleep 3
          done
          echo "Could not publish hero.gif after four attempts."
          exit 1
