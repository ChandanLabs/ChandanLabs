name: Generate animated hero banner

on:
  push:
    branches: [main]
    paths:
      - "scripts/generate-hero-gif.py"
      - ".github/workflows/generate-hero-gif.yml"
  schedule:
    - cron: "29 2 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: generate-hero-banner
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install image dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-dejavu-core
          python -m pip install --upgrade pip
          python -m pip install Pillow

      - name: Generate animated GIF
        run: python scripts/generate-hero-gif.py

      - name: Commit generated banner
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add hero.gif
          if ! git diff --cached --quiet; then
            git commit -m "chore: regenerate animated Java-first hero banner"
            git push
          else
            echo "Hero GIF is already up to date."
          fi
