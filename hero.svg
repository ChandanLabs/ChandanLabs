<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 540" width="1280" height="540" role="img" aria-labelledby="title desc">
<title id="title">Chandan Kumar Sah Teli — AI Backend Developer</title>
<desc id="desc">An animated midnight-glass developer hero with a custom vector avatar, changing roles and a Node.js themed laptop.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#101426"/><stop offset=".55" stop-color="#0d0e16"/><stop offset="1" stop-color="#171026"/></linearGradient>
  <linearGradient id="aurora" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#22d3ee"/><stop offset=".52" stop-color="#a78bfa"/><stop offset="1" stop-color="#f472b6"/></linearGradient>
  <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#142a3a"/><stop offset="1" stop-color="#241636"/></linearGradient>
  <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#a78bfa" opacity=".18"/></pattern>
  <filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <style><![CDATA[
    text{font-family:Inter,Segoe UI,Arial,sans-serif}
    .mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace}
    .fade{opacity:0;animation:rise .9s ease-out forwards}
    .d1{animation-delay:.2s}.d2{animation-delay:.45s}.d3{animation-delay:.7s}
    @keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
    @keyframes blink{0%,48%{opacity:1}49%,100%{opacity:.18}}
    @keyframes sweep{0%{transform:translateX(-360px);opacity:0}15%{opacity:.6}75%{opacity:.15}100%{transform:translateX(520px);opacity:0}}
    @keyframes roleCycle{0%,27%{opacity:1;transform:translateY(0)}32%,100%{opacity:0;transform:translateY(-8px)}}
    @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
    .role{animation:roleCycle 12s linear infinite}.r2{animation-delay:-4s}.r3{animation-delay:-8s}
    .cursor{animation:blink 1s steps(2,end) infinite}
    .float{animation:float 5s ease-in-out infinite}
    .sweep{animation:sweep 7s ease-in-out infinite}
    @media(prefers-reduced-motion:reduce){*{animation:none!important}}
  ]]></style>
<clipPath id="profilePhotoClip"><circle cx="665" cy="253" r="73"/></clipPath></defs>
<rect width="1280" height="540" rx="28" fill="url(#bg)"/>
<rect width="1280" height="540" rx="28" fill="url(#dots)"/>
<circle cx="1080" cy="80" r="200" fill="#a78bfa" opacity=".05"/>
<circle cx="950" cy="400" r="250" fill="#22d3ee" opacity=".04"/>
<rect x="1" y="1" width="1278" height="538" rx="27" fill="none" stroke="url(#aurora)" stroke-opacity=".7"/>
<path d="M36 80V36H80M1200 36h44v44M36 460v44h44M1200 504h44v-44" fill="none" stroke="#22d3ee" stroke-width="2" opacity=".75"/>
<g class="fade d1">
  <rect x="78" y="55" width="180" height="34" rx="17" fill="#12252d" stroke="#22d3ee" stroke-opacity=".5"/>
  <circle cx="98" cy="72" r="5" fill="#34d399"><animate attributeName="opacity" values="1;.25;1" dur="2s" repeatCount="indefinite"/></circle>
  <text x="113" y="77" fill="#b9f6ff" font-size="13" font-weight="700" letter-spacing="1.5">OPEN TO COLLABS</text>
</g>
<g class="fade d1">
  <text x="80" y="150" fill="#aab2cb" font-size="23">Hi there, I’m</text>
  <text x="76" y="216" fill="#eceef6" font-size="47" font-weight="800" letter-spacing="-1.2">Chandan Kumar</text>
  <text x="76" y="267" fill="url(#aurora)" font-size="47" font-weight="800" letter-spacing="-1.2" filter="url(#glow)">Sah Teli</text>
  <rect x="79" y="289" width="8" height="34" rx="4" fill="#22d3ee"/>
  <g class="role"><text x="105" y="313" fill="#eceef6" font-size="23" font-weight="700">AI Backend Developer</text></g>
  <g class="role r2"><text x="105" y="313" fill="#eceef6" font-size="23" font-weight="700">Backend &amp; API Engineer</text></g>
  <g class="role r3"><text x="105" y="313" fill="#eceef6" font-size="23" font-weight="700">AI + Cloud Builder</text></g>
  <text x="79" y="362" fill="#aab2cb" font-size="17">Building useful software at the intersection of</text>
  <text x="79" y="386" fill="#aab2cb" font-size="17">backend systems, AI workflows and developer tools.</text>
</g>
<g class="fade d2"><circle cx="665" cy="253" r="85" fill="#111827" stroke="url(#aurora)" stroke-width="2" filter="url(#glow)"/><image href="data:image/jpeg;base64," x="592" y="180" width="146" height="146" preserveAspectRatio="xMidYMid slice" clip-path="url(#profilePhotoClip)"/><circle cx="665" cy="253" r="77" fill="none" stroke="#22d3ee" stroke-opacity=".85" stroke-width="1.5"/><rect x="585" y="346" width="160" height="27" rx="13.5" fill="#111827" stroke="#a78bfa" stroke-opacity=".8"/><text x="665" y="363" text-anchor="middle" fill="#eceef6" font-size="10" font-weight="800" letter-spacing="1.3">CSE STUDENT · 2027</text></g>
<g class="fade d2">
  <rect x="78" y="425" width="190" height="55" rx="13" fill="#111b29" stroke="#27384a"/>
  <text x="96" y="447" class="mono" font-size="10" fill="#7e91ab" letter-spacing="1.5">CURRENT CHAPTER</text>
  <text x="96" y="466" font-size="15" fill="#eaf8ff" font-weight="700">CSE · Class of 2027</text>
  <rect x="281" y="425" width="245" height="55" rx="13" fill="#111b29" stroke="#27384a"/>
  <text x="299" y="447" class="mono" font-size="10" fill="#7e91ab" letter-spacing="1.5">BUILDING FROM</text>
  <text x="299" y="466" font-size="15" fill="#eaf8ff" font-weight="700">Aditya University</text>
</g>
<g class="float">
  <ellipse cx="965" cy="470" rx="190" ry="17" fill="#22d3ee" opacity=".09"/>
  <rect x="826" y="305" width="286" height="157" rx="15" fill="#111827" stroke="url(#aurora)" stroke-width="2"/>
  <rect x="839" y="318" width="260" height="130" rx="9" fill="url(#screen)"/>
  <circle cx="852" cy="330" r="3" fill="#f472b6"/><circle cx="863" cy="330" r="3" fill="#a78bfa"/><circle cx="874" cy="330" r="3" fill="#34d399"/>
  <text x="855" y="357" class="mono" font-size="12" fill="#22d3ee">const builder = {</text>
  <text x="869" y="378" class="mono" font-size="12" fill="#eceef6">focus: <tspan fill="#f472b6">'backend'</tspan>,</text>
  <text x="869" y="399" class="mono" font-size="12" fill="#eceef6">interest: <tspan fill="#f472b6">'AI + cloud'</tspan>,</text>
  <text x="855" y="420" class="mono" font-size="12" fill="#22d3ee">}; <tspan class="cursor" fill="#f472b6">▌</tspan></text>
  <path d="M800 462h337l-31 20H831z" fill="#273142" stroke="#48546b"/>
  <path d="M914 465h107l-8 5h-91z" fill="#69738a" opacity=".7"/>
</g>
<g class="float" style="animation-delay:-2s">
  <rect x="1000" y="92" width="164" height="86" rx="15" fill="#12182a" stroke="#a78bfa" stroke-opacity=".65"/>
  <text x="1018" y="118" class="mono" font-size="10" fill="#8b99b6">STACK / CORE</text>
  <circle cx="1038" cy="146" r="16" fill="#245438" stroke="#76d275"/>
  <text x="1038" y="151" text-anchor="middle" font-size="13" fill="#d8ffcf" font-weight="800">JS</text>
  <text x="1064" y="144" fill="#eceef6" font-size="15" font-weight="700">Node.js</text>
  <text x="1064" y="160" fill="#9da8c2" font-size="10">APIs · services</text>
</g>
<path class="sweep" d="M720 60l135 0-155 425h-135z" fill="url(#aurora)" opacity=".1"/>
<text x="80" y="518" class="mono" font-size="11" fill="#6c7895">SURAMPALEM, ANDHRA PRADESH, INDIA</text>
<text x="1198" y="518" class="mono" font-size="11" text-anchor="end" fill="#6c7895">DESIGN / BUILD / LEARN</text>
</svg>