 <g transform="translate(170 20)"><circle cx="28" cy="28" r="22" fill="none" stroke="#27354b" stroke-width="5"/><circle class="ring" cx="28" cy="28" r="22" fill="none" stroke="#a78bfa" stroke-width="5" stroke-dasharray="100" stroke-dashoffset="27" transform="rotate(-90 28 28)" style="animation-delay:-1.3s"/><text x="28" y="32" fill="#eceef6" font-size="12" font-weight="800" text-anchor="middle">02</text><text x="62" y="25" fill="#eceef6" font-size="14" font-weight="700">Learn</text><text x="62" y="43" fill="#8999b5" font-size="11">Improve the fundamentals</text></g>
