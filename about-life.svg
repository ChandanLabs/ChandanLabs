<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640" role="img" aria-labelledby="title desc">
<title id="title">What I build and life beyond code</title><desc id="desc">Two midnight-glass cards show backend capabilities and an animated carousel of coding, AI, learning and fitness interests.</desc>
<defs>
 <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#141a2a"/><stop offset="1" stop-color="#0e1019"/></linearGradient>
 <linearGradient id="a" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#22d3ee"/><stop offset=".52" stop-color="#a78bfa"/><stop offset="1" stop-color="#f472b6"/></linearGradient>
 <pattern id="d" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#a78bfa" opacity=".14"/></pattern>
 <style><![CDATA[
 text{font-family:Inter,Segoe UI,Arial,sans-serif}.mono{font-family:ui-monospace,Consolas,monospace}
 .slide{opacity:0;animation:carousel 16s linear infinite}.s2{animation-delay:-12s}.s3{animation-delay:-8s}.s4{animation-delay:-4s}
 @keyframes carousel{0%,4%{opacity:0;transform:translateY(10px)}9%,24%{opacity:1;transform:translateY(0)}29%,100%{opacity:0;transform:translateY(-7px)}}
 .ring{transform-origin:center;animation:ring 4s linear infinite}
 @keyframes ring{from{stroke-dashoffset:100}to{stroke-dashoffset:0}}
 .type{animation:blink 1s steps(2,end) infinite}@keyframes blink{50%{opacity:.2}}
 @media(prefers-reduced-motion:reduce){*{animation:none!important;opacity:1!important}}
 ]]></style>
</defs>
<rect width="1280" height="640" rx="26" fill="#0d0e16"/><rect width="1280" height="640" rx="26" fill="url(#d)"/>
<rect x="16" y="16" width="610" height="608" rx="22" fill="url(#panel)" stroke="#22d3ee" stroke-opacity=".35"/>
<rect x="654" y="16" width="610" height="608" rx="22" fill="url(#panel)" stroke="#a78bfa" stroke-opacity=".45"/>
<text x="52" y="63" fill="#22d3ee" font-size="12" font-weight="700" letter-spacing="3">01 / WHAT I BUILD</text>
<text x="52" y="101" fill="#eceef6" font-size="28" font-weight="800">Useful systems, not just demos.</text>
<g>
 <rect x="52" y="126" width="538" height="208" rx="13" fill="#0b111c" stroke="#29354a"/>
 <path d="M52 164h538" stroke="#29354a"/><circle cx="72" cy="145" r="4" fill="#f472b6"/><circle cx="86" cy="145" r="4" fill="#a78bfa"/><circle cx="100" cy="145" r="4" fill="#34d399"/>
 <rect x="132" y="135" width="270" height="19" rx="6" fill="#151d2b"/><text x="144" y="148" class="mono" fill="#7d8ca8" font-size="10">services / reliable by design</text>
 <text x="76" y="192" class="mono" font-size="13" fill="#22d3ee">async function buildSomethingUseful() {</text>
 <text x="93" y="216" class="mono" font-size="13" fill="#eceef6">const data = await validate(input);</text>
 <text x="93" y="240" class="mono" font-size="13" fill="#eceef6">const result = await service.run(data);</text>
 <text x="93" y="264" class="mono" font-size="13" fill="#eceef6">return response.ok(result);</text>
 <text x="76" y="288" class="mono" font-size="13" fill="#22d3ee">}<tspan class="type" fill="#f472b6"> ▌</tspan></text>
 <text x="76" y="315" font-size="10" fill="#7687a5">VALIDATE  →  PROCESS  →  RESPOND</text>
</g>
<g>
