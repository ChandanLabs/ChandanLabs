 <circle cx="83" cy="387" r="16" fill="#132f3a" stroke="#22d3ee"/><path d="M76 387l5 5 9-11" fill="none" stroke="#b8f7ff" stroke-width="2.5" stroke-linecap="round"/>
 <text x="112" y="381" fill="#eceef6" font-size="16" font-weight="700">Backend &amp; API engineering</text><text x="112" y="400" fill="#9aa8c0" font-size="12">Node.js · Express · Java · REST · databases</text>
 <rect x="52" y="433" width="538" height="67" rx="12" fill="#121727" stroke="#27334a"/>
 <circle cx="83" cy="466" r="16" fill="#231b3d" stroke="#a78bfa"/><path d="M75 466h16M83 458v16" stroke="#d7cbff" stroke-width="2"/>
 <text x="112" y="460" fill="#eceef6" font-size="16" font-weight="700">AI-enabled workflows</text><text x="112" y="479" fill="#9aa8c0" font-size="12">LLM integration · automation · anomaly detection basics</text>
 <rect x="52" y="512" width="538" height="67" rx="12" fill="#121727" stroke="#27334a"/>
 <circle cx="83" cy="545" r="16" fill="#302033" stroke="#f472b6"/><path d="M76 545l5 5 9-11" fill="none" stroke="#ffd0e9" stroke-width="2.5" stroke-linecap="round"/>
 <text x="112" y="539" fill="#eceef6" font-size="16" font-weight="700">Practical developer tooling</text><text x="112" y="558" fill="#9aa8c0" font-size="12">Extensions · sync utilities · tests · cloud fundamentals</text>
</g>
<text x="690" y="63" fill="#f472b6" font-size="12" font-weight="700" letter-spacing="3">02 / OUTSIDE THE TERMINAL</text>
<text x="690" y="101" fill="#eceef6" font-size="28" font-weight="800">Curiosity keeps the loop running.</text>
