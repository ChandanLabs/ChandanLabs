 <text x="959" y="324" fill="#eceef6" font-size="22" font-weight="800" text-anchor="middle">Cloud &amp; systems</text>
 <text x="959" y="347" fill="#9aa8c0" font-size="13" text-anchor="middle">Understanding how software behaves beyond local.</text>
