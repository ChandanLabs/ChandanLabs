<text x="48" y="52" fill="#22d3ee" font-size="12" font-weight="800" letter-spacing="3">HAVE AN IDEA? LET'S BUILD.</text>
<text x="48" y="88" fill="#eceef6" font-size="28" font-weight="800">Good software starts with a conversation.</text>
