<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 470" width="1280" height="470" role="img" aria-labelledby="title desc">
<title id="title">Let's connect with Chandan</title><desc id="desc">A friendly original vector developer avatar points toward contact cards for GitHub, email, LinkedIn and portfolio.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#15172a"/><stop offset="1" stop-color="#0d0e16"/></linearGradient>
 <linearGradient id="a" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#22d3ee"/><stop offset=".52" stop-color="#a78bfa"/><stop offset="1" stop-color="#f472b6"/></linearGradient>
 <style><![CDATA[
 text{font-family:Inter,Segoe UI,Arial,sans-serif}.mono{font-family:ui-monospace,Consolas,monospace}
 .card{fill:#111827;stroke:#33415a;stroke-width:1.2}.arrow{animation:nudge 1.8s ease-in-out infinite}
 @keyframes nudge{0%,100%{transform:translateX(0)}50%{transform:translateX(5px)}}
 @keyframes glow{0%,100%{opacity:.25}50%{opacity:.8}}
 .halo{animation:glow 4s ease-in-out infinite}
 @media(prefers-reduced-motion:reduce){*{animation:none!important}}
 ]]></style>
</defs>
<rect width="1280" height="470" rx="26" fill="url(#bg)"/><rect x="1" y="1" width="1278" height="468" rx="25" fill="none" stroke="url(#a)" stroke-opacity=".65"/>
